<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Basket Foul Counter</title>

  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="preGame" class="screen">
    <h2>試合前</h2>
    <input id="teamAName" placeholder="チームA名"><br>
    <input id="teamBName" placeholder="チームB名"><br>
    <button id="startGameBtn">試合開始</button>
  </div>

  <div id="preQuarter" class="screen hidden">
    <h2>各Q開始前</h2>
    <p>出場選手5名を選択してください</p>
    <div id="playerSelectArea"></div>
    <button id="startQuarterBtn">Q開始</button>
  </div>

  <div id="inGame" class="screen hidden">
    <h2>試合中</h2>

    <!-- ★ ファール操作ボタンを追加 -->
    <button id="openFoulModeBtn">ファール操作</button>

    <div id="foulMode" class="mode hidden">
      <h3>ファール操作</h3>
      <button class="teamSelect" data-team="A">赤チーム</button>
      <button class="teamSelect" data-team="B">青チーム</button>
      <div id="jerseyList"></div>
    </div>

    <div id="substitutionMode" class="mode hidden">
      <h3>交代操作</h3>
      <div id="onCourtList"></div>
      <div id="benchList"></div>
    </div>

    <div id="quarterControl" class="mode hidden">
      <h3>次のQへ</h3>
      <button id="advanceQuarterBtn">進む</button>
    </div>
  </div>

  <div id="halfTime" class="screen hidden">
    <h2>ハーフタイム</h2>
    <p>チームファールは自動リセットされます</p>
    <button id="halfTimeNextBtn">次へ</button>
  </div>

  <div id="postGame" class="screen hidden">
    <h2>試合終了</h2>
    <button id="finishGameBtn">終了</button>
    <button id="startOTBtn">延長戦</button>
  </div>

  <div id="confirmFoul" class="dialog hidden">
    <h3>ファール確認</h3>
    <p id="foulSummary"></p>
    <button id="confirmFoulOK">OK</button>
    <button id="confirmFoulFix">修正</button>
  </div>

  <div id="confirmSubstitution" class="dialog hidden">
    <h3>交代確認</h3>
    <p id="subSummary"></p>
    <button id="confirmSubstitutionOK">OK</button>
  </div>

  <script type="module">
    import { StateMachine } from "./stateMachine.js";

    async function loadAllConfigs() {
      const game = await (await fetch("./config/game.json")).json();
      const ui = await (await fetch("./config/ui.json")).json();
      const sound = await (await fetch("./config/sound.json")).json();
      const teams = await (await fetch("./config/teams.json")).json();
      const players = await (await fetch("./config/players.json")).json();
      const stateMachineConfig = await (await fetch("./config/stateMachine.json")).json();

      console.log("[DEBUG] Loaded stateMachine.json:", stateMachineConfig);

      return { game, ui, sound, teams, players, stateMachineConfig };
    }

    loadAllConfigs().then(cfg => {
      const sm = new StateMachine(cfg.stateMachineConfig);

      console.log("[DEBUG] Initial StateMachine state:", sm.getState());

      function updateUI() {
        const st = sm.getState();
        console.log("[DEBUG] updateUI() called. Current state:", st);

        // GameState
        document.querySelectorAll(".screen").forEach(s => s.classList.add("hidden"));
        console.log("[DEBUG] Showing screen:", st.game);
        document.getElementById(st.game).classList.remove("hidden");

        // OperationMode
        document.querySelectorAll(".mode").forEach(m => m.classList.add("hidden"));
        if (st.operation) {
          console.log("[DEBUG] Showing operation mode:", st.operation + "Mode");
          document.getElementById(st.operation + "Mode").classList.remove("hidden");
        }

        // ConfirmState
        document.querySelectorAll(".dialog").forEach(d => d.classList.add("hidden"));
        if (st.confirm) {
          console.log("[DEBUG] Showing confirm dialog:", st.confirm);
          document.getElementById(st.confirm).classList.remove("hidden");
        }
      }

      // GameState
      document.getElementById("startGameBtn").onclick = () => {
        console.log("[DEBUG] startGameBtn clicked");
        sm.transitionGame("startGame");
        console.log("[DEBUG] After transitionGame(startGame):", sm.getState());
        updateUI();
      };

      document.getElementById("startQuarterBtn").onclick = () => {
        console.log("[DEBUG] startQuarterBtn clicked");
        sm.transitionGame("startQuarter");
        console.log("[DEBUG] After transitionGame(startQuarter):", sm.getState());
        updateUI();
      };

      document.getElementById("advanceQuarterBtn").onclick = () => {
        console.log("[DEBUG] advanceQuarterBtn clicked");
        sm.transitionGame("endQuarter");
        console.log("[DEBUG] After transitionGame(endQuarter):", sm.getState());
        updateUI();
      };

      document.getElementById("halfTimeNextBtn").onclick = () => {
        console.log("[DEBUG] halfTimeNextBtn clicked");
        sm.transitionGame("resume");
        console.log("[DEBUG] After transitionGame(resume):", sm.getState());
        updateUI();
      };

      document.getElementById("finishGameBtn").onclick = () => {
        console.log("[DEBUG] finishGameBtn clicked");
        sm.transitionGame("endGame");
        console.log("[DEBUG] After transitionGame(endGame):", sm.getState());
        updateUI();
      };

      document.getElementById("startOTBtn").onclick = () => {
        console.log("[DEBUG] startOTBtn clicked");
        sm.transitionGame("startOT");
        console.log("[DEBUG] After transitionGame(startOT):", sm.getState());
        updateUI();
      };

      // ★ ファール操作モードを開くボタン
      document.getElementById("openFoulModeBtn").onclick = () => {
        console.log("[DEBUG] openFoulModeBtn clicked");
        sm.enterOperationMode("foulMode");
        console.log("[DEBUG] After enterOperationMode(foulMode):", sm.getState());
        updateUI();
      };

      // OperationMode（チーム選択 → confirmFoul へ）
      document.querySelectorAll(".teamSelect").forEach(btn => {
        btn.onclick = () => {
          console.log("[DEBUG] teamSelect clicked:", btn.dataset.team);
          // ここでは既に foulMode にいる前提なので confirm へ
          sm.transitionOperation("confirm");
          console.log("[DEBUG] After transitionOperation(confirm):", sm.getState());
          updateUI();
        };
      });

      // ConfirmState
      document.getElementById("confirmFoulOK").onclick = () => {
        console.log("[DEBUG] confirmFoulOK clicked");
        sm.transitionConfirm("ok");
        console.log("[DEBUG] After transitionConfirm(ok):", sm.getState());
        updateUI();
      };

      document.getElementById("confirmFoulFix").onclick = () => {
        console.log("[DEBUG] confirmFoulFix clicked");
        sm.transitionConfirm("fix");
        console.log("[DEBUG] After transitionConfirm(fix):", sm.getState());
        updateUI();
      };

      document.getElementById("confirmSubstitutionOK").onclick = () => {
        console.log("[DEBUG] confirmSubstitutionOK clicked");
        sm.transitionConfirm("ok");
        console.log("[DEBUG] After transitionConfirm(ok):", sm.getState());
        updateUI();
      };

      updateUI();
    });
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .catch(err => console.error('SW registration failed:', err));
    }
  </script>

</body>
</html>
