<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Basket Foul Counter</title>

  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 試合前 -->
  <div id="preGame" class="screen">
    <h2>試合前</h2>
    <input id="teamAName" placeholder="チームA名"><br>
    <input id="teamBName" placeholder="チームB名"><br>
    <button id="startGameBtn">試合開始</button>
  </div>

  <!-- 各Q開始前（選手選択） -->
  <div id="preQuarter" class="screen hidden">
    <h2>各Q開始前</h2>

    <!-- A/B チーム選択 -->
    <div id="teamSelectArea">
      <button class="teamSelectBtn" data-team="A">Aチーム</button>
      <button class="teamSelectBtn" data-team="B">Bチーム</button>
    </div>

    <!-- 選手選択エリア -->
    <div id="playerSelectArea" class="hidden">
      <h3 id="teamSelectTitle"></h3>

      <!-- 選択中ゼッケン表示枠 -->
      <p>選択中の出場選手（最大5名） <span id="selectedCountLabel"></span></p>
      <div id="onCourtSelectArea"></div>

      <p>控え選手</p>
      <div id="benchSelectArea"></div>

      <button id="clearSelectionBtn" class="small danger">選択クリア</button>
      <!-- ★ ここにあった startQuarterBtn は削除（固定配置のボタンと重複するため） -->
    </div>
  </div>

  <!-- 試合中 -->
  <div id="inGame" class="screen hidden">
    <h2>試合中 <span id="currentQuarterLabel"></span></h2>

    <div id="foulMode" class="mode">
      <div class="teamButtons">
        <button class="teamSelect big red" data-team="A">赤チーム</button>
        <button class="teamSelect big blue" data-team="B">青チーム</button>
      </div>

      <div class="utilityButtons">
        <button id="cancelGameBtn" class="small danger">試合キャンセル</button>
        <button id="showListBtn" class="small info">一覧表示</button>
      </div>

      <!-- チームファール表示（視覚強調用） -->
      <div class="teamFoulsDisplay">
        <span id="teamAFoulsLabel">A: 0</span>
        <span id="teamBFoulsLabel">B: 0</span>
      </div>
    </div>

    <div id="listView" class="mode hidden">
      <h3>ファール一覧</h3>
      <div id="playerFoulList"></div>
      <button id="closeListBtn" class="small info">閉じる</button>
    </div>

    <div id="substitutionMode" class="mode hidden">
      <h3>交代操作</h3>
      <div id="onCourtList"></div>
      <div id="benchList"></div>
    </div>

    <div id="quarterControl" class="mode hidden">
      <h3>次のQへ</h3>
      <button id="advanceQuarterBtn">進む</button>
    </div>
  </div>

  <!-- ハーフタイム -->
  <div id="halfTime" class="screen hidden">
    <h2>ハーフタイム</h2>
    <p>チームファールは自動リセットされます</p>
    <button id="halfTimeNextBtn">次へ</button>
  </div>

  <!-- 試合終了 -->
  <div id="postGame" class="screen hidden">
    <h2>試合終了</h2>
    <button id="finishGameBtn">終了</button>
    <button id="startOTBtn">延長戦</button>
  </div>

  <!-- ファール確認 -->
  <div id="confirmFoul" class="dialog hidden">
    <h3>ファール確認</h3>
    <p id="foulSummary"></p>
    <button id="confirmFoulOK">OK</button>
    <button id="confirmFoulFix">修正</button>
  </div>

  <!-- 交代確認 -->
  <div id="confirmSubstitution" class="dialog hidden">
    <h3>交代確認</h3>
    <p id="subSummary"></p>
    <button id="confirmSubstitutionOK">OK</button>
  </div>

  <!-- 戻る確認 -->
  <div id="confirmBack" class="dialog hidden">
    <h3>画面を戻しますか？</h3>
    <p>必要に応じてデータがリセットされます。</p>
    <button id="confirmBackOK">OK</button>
    <button id="confirmBackCancel">キャンセル</button>
  </div>

  <!-- 5名未満での試合開始確認 -->
  <div id="confirmStartUnderFive" class="dialog hidden">
    <h3>選手が5名未満です</h3>
    <p>この人数で試合を開始しますか？</p>
    <button id="confirmStartUnderFiveOK">OK</button>
    <button id="confirmStartUnderFiveCancel">キャンセル</button>
  </div>

  <!-- Q開始ボタン（戻るボタンの上に固定配置） -->
  <button id="startQuarterBtn" class="small primary startQuarterButton hidden">Q開始</button>

  <!-- 画面下端の戻るボタン -->
  <button id="backBtn" class="small info backButton">戻る</button>

  <!-- ================================
       メインロジック
  ================================= -->
  <script type="module">
    import { StateMachine } from "./stateMachine.js";

    async function loadAllConfigs() {
      const ui = await (await fetch("./config/ui.json")).json();
      const sound = await (await fetch("./config/sound.json")).json();
      const teams = await (await fetch("./config/teams.json")).json();
      const players = await (await fetch("./config/players.json")).json();
      const stateMachineConfig = await (await fetch("./config/stateMachine.json")).json();

      return { ui, sound, teams, players, stateMachineConfig };
    }

    loadAllConfigs().then(cfg => {
      const sm = new StateMachine(cfg.stateMachineConfig);

      // ================================
      // UI更新
      // ================================
      function updateUI() {
        const st = sm.getState();

        // 画面・モード・ダイアログを一旦全部隠す
        document.querySelectorAll(".screen").forEach(s => s.classList.add("hidden"));
        document.querySelectorAll(".mode").forEach(m => m.classList.add("hidden"));
        document.querySelectorAll(".dialog").forEach(d => d.classList.add("hidden"));

        // GameState 表示
        const screen = document.getElementById(st.game);
        if (screen) screen.classList.remove("hidden");

        // OperationMode 表示
        if (st.operation) {
          const mode = document.getElementById(st.operation);
          if (mode) mode.classList.remove("hidden");
        }

        // ConfirmState 表示
        if (st.confirm) {
          const dlg = document.getElementById(st.confirm);
          if (dlg) dlg.classList.remove("hidden");
        }

        // Qラベル
        const qLabel = document.getElementById("currentQuarterLabel");
        if (qLabel) qLabel.textContent = sm.currentQuarterLabel || "";

        // チームファール表示
        const teamAFoulsLabel = document.getElementById("teamAFoulsLabel");
        const teamBFoulsLabel = document.getElementById("teamBFoulsLabel");
        if (teamAFoulsLabel && sm.teams && sm.teams.teams) {
          teamAFoulsLabel.textContent = `A: ${sm.teams.teams.teamA.teamFouls}`;
        }
        if (teamBFoulsLabel && sm.teams && sm.teams.teams) {
          teamBFoulsLabel.textContent = `B: ${sm.teams.teams.teamB.teamFouls}`;
        }
      }

      // ================================
      // 選手選択 UI
      // ================================
      document.querySelectorAll(".teamSelectBtn").forEach(btn => {
        btn.onclick = () => {
          const teamSide = btn.dataset.team;
          sm.selectTeamSide(teamSide);

          document.getElementById("teamSelectArea").classList.add("hidden");
          document.getElementById("playerSelectArea").classList.remove("hidden");

          document.getElementById("teamSelectTitle").textContent =
            teamSide === "A" ? "Aチーム選手選択" : "Bチーム選手選択";

          renderPlayerSelectUI(teamSide);
        };
      });

      function renderPlayerSelectUI(teamSide) {
        const onCourtArea = document.getElementById("onCourtSelectArea");
        const benchArea = document.getElementById("benchSelectArea");
        const selectedCountLabel = document.getElementById("selectedCountLabel");

        onCourtArea.innerHTML = "";
        benchArea.innerHTML = "";

        // 背景色切り替え
        onCourtArea.classList.remove("teamA-bg", "teamB-bg");
        benchArea.classList.remove("teamA-bg", "teamB-bg");
        if (teamSide === "A") {
          onCourtArea.classList.add("teamA-bg");
          benchArea.classList.add("teamA-bg");
        } else {
          onCourtArea.classList.add("teamB-bg");
          benchArea.classList.add("teamB-bg");
        }

        const selectedList = teamSide === "A"
          ? sm.selectedPlayers_A
          : sm.selectedPlayers_B;

        // 選択中ゼッケン表示
        selectedList.forEach(num => {
          const div = document.createElement("div");
          div.className = "selectedNumber";
          div.textContent = num;
          onCourtArea.appendChild(div);
        });

        if (selectedCountLabel) {
          selectedCountLabel.textContent = `選択中：${selectedList.length} / 5`;
        }

        // 前Q出場選手を先頭に
        const previousOnCourt = sm.players.players
          .filter(p => p.teamSide === teamSide && p.isOnCourt)
          .map(p => p.jerseyNumber);

        const benchNumbers = [];
        previousOnCourt.forEach(num => benchNumbers.push(num));
        for (let i = 1; i <= 99; i++) {
          if (!previousOnCourt.includes(i)) benchNumbers.push(i);
        }

        benchNumbers.forEach(num => {
          const isSelected = selectedList.includes(num);
          benchArea.appendChild(createPlayerButton(num, isSelected));
        });

        // Q開始ボタンの表示更新
        updateStartQuarterButton();
      }

      function createPlayerButton(number, isSelected = false) {
        const btn = document.createElement("div");
        btn.className = isSelected ? "playerItem onCourt" : "playerItem bench";
        btn.textContent = number;

        btn.onclick = () => {
          const beforeList = sm.selectedTeamSide === "A"
            ? [...sm.selectedPlayers_A]
            : [...sm.selectedPlayers_B];

          sm.toggleSelectPlayer(number);

          const afterList = sm.selectedTeamSide === "A"
            ? sm.selectedPlayers_A
            : sm.selectedPlayers_B;

          const wasSelected = beforeList.includes(number);
          const isSelectedNow = afterList.includes(number);

          if (!wasSelected && isSelectedNow) {
            btn.classList.remove("bench");
            btn.classList.add("onCourt");
          } else if (wasSelected && !isSelectedNow) {
            btn.classList.remove("onCourt");
            btn.classList.add("bench");
          }

          renderPlayerSelectUI(sm.selectedTeamSide);
          updateStartQuarterButton();
        };

        return btn;
      }

      function updateStartQuarterButton() {
        const btn = document.getElementById("startQuarterBtn");
        const listA = sm.selectedPlayers_A;
        const listB = sm.selectedPlayers_B;

        // AとBが1名以上ならボタン表示
        if (listA.length >= 1 && listB.length >= 1) {
          btn.classList.remove("hidden");
        } else {
          btn.classList.add("hidden");
        }
      }

      document.getElementById("clearSelectionBtn").onclick = () => {
        const teamSide = sm.selectedTeamSide;
        if (!teamSide) return;

        if (teamSide === "A") {
          sm.selectedPlayers_A = [];
        } else {
          sm.selectedPlayers_B = [];
        }
        sm.saveState();

        renderPlayerSelectUI(teamSide);
        updateStartQuarterButton();
      };

      document.getElementById("startQuarterBtn").onclick = () => {
        const listA = sm.selectedPlayers_A;
        const listB = sm.selectedPlayers_B;

        // 5名未満なら確認画面へ
        if (listA.length < 5 || listB.length < 5) {
          sm.currentConfirmState = "confirmStartUnderFive";
          sm.saveState();
          updateUI();
          return;
        }

        // 5名そろっている場合は即開始
        sm.commitSelectedPlayers();
        updateUI();
      };

      // ================================
      // 試合進行
      // ================================
      document.getElementById("startGameBtn").onclick = () => {
        sm.transitionGame("startGame");
        updateUI();
      };

      document.getElementById("advanceQuarterBtn").onclick = () => {
        sm.transitionGame("endQuarter");
        updateUI();
      };

      document.getElementById("halfTimeNextBtn").onclick = () => {
        sm.transitionGame("startQuarter");
        updateUI();
      };

      document.getElementById("finishGameBtn").onclick = () => {
        sm.transitionGame("finishGame");
        localStorage.clear();
        updateUI();
      };

      document.getElementById("startOTBtn").onclick = () => {
        sm.transitionGame("startOT");
        updateUI();
      };

      // ================================
      // ファール関連
      // ================================
      document.querySelectorAll(".teamSelect.big").forEach(btn => {
        btn.onclick = () => {
          // ★ confirmBack 表示中は他操作を禁止
          if (sm.currentConfirmState === "confirmBack") return;
          const teamSide = btn.dataset.team;
          sm.selectedTeamSide = teamSide;
          sm.enterOperationMode("foulMode");
          updateUI();
        };
      });

      document.getElementById("showListBtn").onclick = () => {
        sm.enterOperationMode("listView");
        updateUI();
      };

      document.getElementById("closeListBtn").onclick = () => {
        sm.enterOperationMode("foulMode");
        updateUI();
      };

      document.getElementById("confirmFoulOK").onclick = () => {
        sm.transitionConfirm("ok");
        updateUI();
      };

      document.getElementById("confirmFoulFix").onclick = () => {
        sm.transitionConfirm("fix");
        updateUI();
      };

      document.getElementById("confirmSubstitutionOK").onclick = () => {
        sm.transitionConfirm("ok");
        updateUI();
      };

      // ================================
      // 戻るボタン
      // ================================
      document.getElementById("backBtn").onclick = () => {
        // ★ 今の状態を「直前状態」として保存してから confirmBack を出す
        sm.savePreviousState();
        sm.currentConfirmState = "confirmBack";
        sm.saveState();
        updateUI();
      };

      document.getElementById("confirmBackOK").onclick = () => {
        // ★ previousState から復元し、confirm をクリア
        if (sm.previousState) {
          sm.currentGameState = sm.previousState.game;
          sm.currentOperationMode = sm.previousState.operation;
          sm.currentConfirmState = sm.previousState.confirm;
        }
        // 戻る確認ダイアログは閉じる
        sm.currentConfirmState = null;
        sm.saveState();
        updateUI();
      };

      document.getElementById("confirmBackCancel").onclick = () => {
        // ★ FSM に任せず、単純にダイアログを閉じるだけ
        sm.currentConfirmState = null;
        sm.saveState();
        updateUI();
      };

      document.getElementById("confirmStartUnderFiveOK").onclick = () => {
        sm.commitSelectedPlayers();
        updateUI();
      };

      document.getElementById("confirmStartUnderFiveCancel").onclick = () => {
        sm.currentConfirmState = null;
        sm.saveState();
        updateUI();
      };

      // 初期表示
      updateUI();
    });
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .catch(err => console.error('SW registration failed:', err));
    }
  </script>

</body>
</html>
