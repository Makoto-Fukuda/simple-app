<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Basket Foul Counter</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 外部CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ========================= -->
  <!-- GameState（第1階層）     -->
  <!-- ========================= -->

  <div id="preGame" class="screen">
    <h2>試合前</h2>
    <input id="teamAName" placeholder="チームA名"><br>
    <input id="teamBName" placeholder="チームB名"><br>
    <button id="startGameBtn">試合開始</button>
  </div>

  <div id="preQuarter" class="screen hidden">
    <h2>各Q開始前</h2>
    <p>出場選手5名を選択してください</p>
    <div id="playerSelectArea"></div>
    <button id="startQuarterBtn">Q開始</button>
  </div>

  <div id="inGame" class="screen hidden">
    <h2>試合中</h2>

    <!-- ========================= -->
    <!-- OperationMode（第2階層） -->
    <!-- ========================= -->

    <div id="foulMode" class="mode hidden">
      <h3>ファール操作</h3>
      <button class="teamSelect" data-team="A">赤チーム</button>
      <button class="teamSelect" data-team="B">青チーム</button>
      <div id="jerseyList"></div>
    </div>

    <div id="substitutionMode" class="mode hidden">
      <h3>交代操作</h3>
      <div id="onCourtList"></div>
      <div id="benchList"></div>
    </div>

    <div id="quarterControl" class="mode hidden">
      <h3>次のQへ</h3>
      <button id="advanceQuarterBtn">進む</button>
    </div>
  </div>

  <div id="halfTime" class="screen hidden">
    <h2>ハーフタイム</h2>
    <p>チームファールは自動リセットされます</p>
    <button id="halfTimeNextBtn">次へ</button>
  </div>

  <div id="postGame" class="screen hidden">
    <h2>試合終了</h2>
    <button id="finishGameBtn">終了</button>
    <button id="startOTBtn">延長戦</button>
  </div>

  <!-- ========================= -->
  <!-- ConfirmState（第3階層） -->
  <!-- ========================= -->

  <div id="confirmFoul" class="dialog hidden">
    <h3>ファール確認</h3>
    <p id="foulSummary"></p>
    <button id="confirmFoulOK">OK</button>
    <button id="confirmFoulFix">修正</button>
  </div>

  <div id="confirmSubstitution" class="dialog hidden">
    <h3>交代確認</h3>
    <p id="subSummary"></p>
    <button id="confirmSubstitutionOK">OK</button>
  </div>

  <!-- ========================= -->
  <!-- JS読み込み（config対応） -->
  <!-- ========================= -->
  <script type="module">
    import { StateMachine } from "./stateMachine.js";

    async function loadAllConfigs() {
      const game = await (await fetch("./config/game.json")).json();
      const ui = await (await fetch("./config/ui.json")).json();
      const sound = await (await fetch("./config/sound.json")).json();
      const teams = await (await fetch("./config/teams.json")).json();
      const players = await (await fetch("./config/players.json")).json();

      return { game, ui, sound, teams, players };
    }

    loadAllConfigs().then(cfg => {
      const sm = new StateMachine(cfg);

      // ============================
      // UI更新（誠の構造に完全一致）
      // ============================
      function updateUI() {
        const st = sm.getState();

        // GameState
        document.querySelectorAll(".screen").forEach(s => s.classList.add("hidden"));
        document.getElementById(st.game).classList.remove("hidden");

        // OperationMode
        document.querySelectorAll(".mode").forEach(m => m.classList.add("hidden"));
        if (st.operation) {
          document.getElementById(st.operation + "Mode").classList.remove("hidden");
        }

        // ConfirmState
        document.querySelectorAll(".dialog").forEach(d => d.classList.add("hidden"));
        if (st.confirm) {
          document.getElementById(st.confirm).classList.remove("hidden");
        }
      }

      // ============================
      // UIイベント接続（完全版）
      // ============================

      // --- GameState ---
      document.getElementById("startGameBtn").onclick = () => {
        sm.transitionGame("startGame");
        updateUI();
      };

      document.getElementById("startQuarterBtn").onclick = () => {
        sm.transitionGame("startQuarter");
        updateUI();
      };

      document.getElementById("advanceQuarterBtn").onclick = () => {
        sm.transitionGame("endQuarter");
        updateUI();
      };

      document.getElementById("halfTimeNextBtn").onclick = () => {
        sm.transitionGame("halfTimeNext");
        updateUI();
      };

      document.getElementById("finishGameBtn").onclick = () => {
        sm.transitionGame("finishGame");
        updateUI();
      };

      document.getElementById("startOTBtn").onclick = () => {
        sm.transitionGame("startOT");
        updateUI();
      };

      // --- OperationMode ---
      document.querySelectorAll(".teamSelect").forEach(btn => {
        btn.onclick = () => {
          const team = btn.dataset.team;
          sm.transitionOperation("selectTeam", { team });
          updateUI();
        };
      });

      // --- ConfirmState ---
      document.getElementById("confirmFoulOK").onclick = () => {
        sm.transitionConfirm("confirmFoulOK");
        updateUI();
      };

      document.getElementById("confirmFoulFix").onclick = () => {
        sm.transitionConfirm("confirmFoulFix");
        updateUI();
      };

      document.getElementById("confirmSubstitutionOK").onclick = () => {
        sm.transitionConfirm("confirmSubstitutionOK");
        updateUI();
      };

      // 初期描画
      updateUI();
    });
  </script>

  <!-- Service Worker 登録 -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .catch(err => console.error('SW registration failed:', err));
    }
  </script>

</body>
</html>
