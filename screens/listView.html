<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ファール一覧</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="page">

    <!-- タイトル -->
    <h1 class="title">ファール一覧（閲覧専用）</h1>

    <!-- 赤チーム -->
    <div class="team-block red-team-block">
        <h2 class="team-title">赤チーム</h2>
        <div id="redTeamList" class="foul-table-container">
            <!-- JS がテーブルを生成 -->
        </div>
    </div>

    <!-- 青チーム -->
    <div class="team-block blue-team-block">
        <h2 class="team-title">青チーム</h2>
        <div id="blueTeamList" class="foul-table-container">
            <!-- JS がテーブルを生成 -->
        </div>
    </div>

</div>

<!-- 固定ボタンバー -->
<div class="fixed-footer">
    <button id="backBtn" class="footer-btn footer-back">
        試合設定へ戻る
    </button>
</div>

</body>
</html>
