<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>第◯Q 終了</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="page">

    <!-- Q表示（JSが書き換える） -->
    <h1 id="quarterLabel" class="title">第 ?Q 終了</h1>

    <!-- スコア表示 -->
    <div class="score-section">
        <div class="score-box red-score">
            <p class="team-name">赤チーム</p>
            <p class="score-value" id="scoreRed">0</p>
        </div>
        <div class="score-box blue-score">
            <p class="team-name">青チーム</p>
            <p class="score-value" id="scoreBlue">0</p>
        </div>
    </div>

    <!-- チームファール数 -->
    <div class="team-foul-count">
        <span class="foul-count red">A: <span id="teamAFoul">0</span></span>
        <span class="foul-count blue">B: <span id="teamBFoul">0</span></span>
    </div>

    <!-- 退場選手一覧 -->
    <div class="player-section">
        <p class="player-label">退場選手</p>
        <div class="player-row" id="outGrid"></div>
    </div>

</div>

<!-- 固定ボタンバー -->
<div class="fixed-footer">
    <button id="backBtn" class="footer-btn footer-back">戻る</button>
    <button id="nextQuarterBtn" class="footer-btn footer-next">次Qへ</button>
    <button id="nextOTBtn" class="footer-btn footer-next">延長戦へ</button>
    <button id="abortBtn" class="footer-btn footer-end">試合終了</button>
</div>

</body>
</html>
