<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>試合中（ファール入力）</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="page">

    <h1 id="quarterLabel" class="title">第 ?Q 試合中</h1>

    <!-- チーム選択カード -->
    <div class="team-select">
        <div class="team-buttons">
            <button class="team-btn red-team" id="teamA">赤チーム</button>
            <button class="team-btn blue-team" id="teamB">青チーム</button>
        </div>

        <!-- ファールカウンタ（中央配置） -->
        <div class="team-foul-center">
            <span class="foul-count red">A: <span id="teamAFoul">0</span></span>
            <span class="foul-count blue">B: <span id="teamBFoul">0</span></span>
        </div>
    </div>

    <!-- 出場選手＋ファール確認（初期は非表示） -->
    <div id="foulArea" class="hidden">
        <div class="player-section">
            <p class="player-label">出場選手</p>
            <div id="onCourtArea" class="player-row"></div>
        </div>
        <div class="foul-section" id="foulSection">
            <p class="foul-title">個人ファール数</p>
            <p class="foul-value" id="playerFoulCount">0</p>
            <button class="ok-btn" id="okBtn">OK</button>
        </div>
    </div>

</div>

<!-- 固定ボタン（戻るは削除） -->
<div class="fixed-footer" id="ingameFooter">
    <button id="changePlayerBtn" class="footer-btn footer-clear">選手交代</button>
    <button id="endQuarterBtn" class="footer-btn footer-next">このQを終了する</button>
</div>

<script type="module" src="../js/inGame.js"></script>

</body>
</html>
