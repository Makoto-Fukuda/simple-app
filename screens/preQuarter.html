<div class="page">

    <h1 id="quarterLabel" class="title">第 ?Q 試合中</h1>

    <div class="team-select">
        <button class="team-btn red-team" id="teamA">Aチーム</button>
        <button class="team-btn blue-team" id="teamB">Bチーム</button>
    </div>

    <div class="player-section">
        <p class="player-label">赤チーム選択中の出場選手（最大5名）</p>
        <div class="player-row fixed-red" id="redOnCourt"></div>

        <p class="player-label">青チーム選択中の出場選手（最大5名）</p>
        <div class="player-row fixed-blue" id="blueOnCourt"></div>
    </div>

    <div class="player-section">
        <p class="player-label">控え選手一覧</p>
        <div id="reserveArea" class="bench-grid teamA-bg" style="max-height: 400px; overflow-y: auto;"></div>
    </div>

    <!-- 固定ボタン（試合開始前／選手交代モード切替対応） -->
    <div class="fixed-footer" id="preQuarterFooter">
        <button id="backBtn" class="footer-btn footer-back">戻る</button>
        <button id="startQuarterBtn" class="footer-btn footer-next">次のクオーターを開始</button>
        <button id="abortBtn" class="footer-btn footer-end">試合を終了する</button>
        <button id="returnToGameBtn" class="footer-btn footer-next hidden">試合に戻る</button>
    </div>

</div>
