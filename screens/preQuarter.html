<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>第1Q 開始前</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="page">

    <h1 class="title" id="quarterTitle">第1Q 開始前</h1>

    <!-- チーム選択 -->
    <div class="team-switch">
        <button class="team-btn team-red" onclick="selectTeam('red')">赤チーム</button>
        <button class="team-btn team-blue" onclick="selectTeam('blue')">青チーム</button>
    </div>

    <!-- 出場選手 -->
    <div class="player-section">
        <p class="player-label">出場選手</p>
        <div class="player-row" id="starterList"></div>

        <p class="player-label">控え選手</p>
        <div class="player-row" id="benchList"></div>
    </div>

</div>

<!-- 固定ボタンバー -->
<div class="fixed-footer">
    <button class="footer-btn footer-back" onclick="navigateTo('../index.html')">戻る</button>
    <button class="footer-btn footer-next" onclick="startGame()">試合開始</button>
    <button class="footer-btn footer-end" onclick="onEndGame()">試合中止</button>
</div>

<!-- 共通JS -->
<script src="../js/app.js"></script>

</body>
</html>
